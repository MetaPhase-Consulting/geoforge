name: Dependency Hygiene

on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

jobs:
  audit-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run audit report
        run: npm audit --audit-level=moderate

      - name: Update lockfile with safe fixes
        run: npm audit fix || true

      - name: Create PR with dependency updates
        uses: peter-evans/create-pull-request@v7
        with:
          branch: codex/dependency-hygiene
          title: 'chore: weekly dependency hygiene updates'
          commit-message: 'chore: apply npm audit fixes'
          body: |
            Weekly dependency hygiene update.

            Includes:
            - npm audit report refresh
            - lockfile updates from `npm audit fix`
